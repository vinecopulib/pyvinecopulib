[build-system]
# Mirror [dependency-groups].build so `--no-build-isolation` rebuilds work.
requires = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=2.0",
  "matplotlib>=3.0",
  "networkx>=3.0",
  # Imported at build time: generate_stubs.py imports pyvinecopulib.core,
  # which imports array_api_compat (see [project].dependencies).
  "array_api_compat>=1.7",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyvinecopulib"
version = "1.0.1"
authors = [
  { name = "Thibault Vatter", email = "info@vinecopulib.com" },
  { name = "Thomas Nagler", email = "info@vinecopulib.com" },
]
description = "A python interface to vinecopulib"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  'numpy>=2.0',
  'matplotlib>=3.0',
  'networkx>=3.0',
  'pydot>=3.0',
  'array_api_compat>=1.7',
]
keywords = ['copula', 'vines copulas', 'pair-copulas constructions']
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Intended Audience :: Financial and Insurance Industry',
  'Intended Audience :: Healthcare Industry',
  'Intended Audience :: Information Technology',
  'Intended Audience :: Other Audience',
  'Intended Audience :: Science/Research',
  'Intended Audience :: Telecommunications Industry',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Programming Language :: C++',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'License :: OSI Approved :: MIT License',
]

[project.optional-dependencies]
examples = ["jupyterlab", "scipy", "xlrd>=2.0"]
sklearn = [
  "scikit-learn>=1.4",
  "pandas>=2.0",
]
torch = [
  # 2.2 is the floor for `torch.compiler.cudagraph_mark_step_begin`, which the
  # compiled cascade calls before each graph replay; `nn.Module.__getstate__`,
  # which `TorchVinecop` delegates to, needs 2.1.
  "torch>=2.2",
]
scipy = [
  # 1.16 is the first release to require Python 3.11, so it is the floor this
  # package's own floor admits; it carries the modern `scipy.stats`
  # distribution classes that `pyvinecopulib.margins.as_margin` adapts. The
  # parametric margins still go through the legacy `rv_continuous.fit`
  # surface, which is much older.
  "scipy>=1.16",
]
doc = [
  # Ranges, not exact pins: `sphinx==7.0` held `sphinx-autodoc-typehints` back
  # to its 2023 releases while the other four floated, so whichever of them
  # raised its Sphinx floor first would break the build with no change here.
  # `make docs` runs with `-W` and nitpicky mode, which is the real guard.
  # The 8.x ceiling is not arbitrary: under Sphinx 8 the current
  # `sphinx-autodoc-typehints` emits a stray `*` into every autosummary entry,
  # so each one raises "Inline emphasis start-string without end-string".
  "sphinx>=7,<8",
  "nbsphinx>=0.9,<0.10",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "myst-parser",
  "numpydoc>=1.7",
]

[dependency-groups]
build = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=1.14",
  "matplotlib>=3.0",
  "networkx>=3.0",
  "array_api_compat>=1.7",
  "ninja",
  "cmake>=3.20",
]
test = [
  "pytest>=8.0",
  "pytest-cov",
  "pytest-rerunfailures",
  "pytest-xdist>=3.6",
  "coverage[toml]",
]
notebooks = ["nbmake", "jupyter", "nbconvert", "nbformat"]
dev = [
  "ty",
  # Pinned to the `.pre-commit-config.yaml` hook rev; see the note there.
  "codespell[toml]==2.4.3",
  "ruff==0.16.7",
  "bandit[toml]==1.9.4",
  "pre-commit",
  "twine",
  { include-group = "build" },
]

[project.urls]
Homepage = "https://github.com/vinecopulib/pyvinecopulib/"
Documentation = "https://pyvinecopulib.readthedocs.io"
Repository = "https://github.com/vinecopulib/pyvinecopulib.git"
Issues = "https://github.com/vinecopulib/pyvinecopulib/issues"

[tool.scikit-build]
# Below the `[build-system].requires` floor on purpose: the one behavior 0.5
# turns on is `install.strip`, and `nanobind_add_module` already links with
# `-Wl,-s`, so the published extension is stripped either way -- measured, the
# same byte count. Raising it would move other version-dependent defaults for
# nothing.
minimum-version = "0.4"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
editable.rebuild = true
# Pipe the rebuild output instead of streaming to sys.stderr — keeps
# notebook executions clean and lets `pytest --nbmake` run locally
# (Jupyter's OutStream doesn't implement fileno(), which the streaming
# subprocess call needs).
editable.verbose = false
# scikit-build-core's default sdist exclude drops `build/`-named dirs,
# which also catches scripts/build.
# Extension-scoped rather than `scripts/**`: a force-include outranks
# `sdist.exclude`, so the directory glob shipped `scripts/__pycache__/*.pyc`.
sdist.include = [
  "scripts/*.py",
  "scripts/*.sh",
  "scripts/*.ipynb",
  "scripts/*.json",
]
sdist.exclude = [
  "build*/**",
  "**/__pycache__/**",
  "**/*.pyc",
  # The lockfile pins the development and CI environments; a source build
  # resolves `[build-system].requires` itself and never reads it, so shipping
  # it would add 0.6 MB to every sdist for nothing.
  "uv.lock",
]

[tool.cibuildwheel]
build-verbosity = 1
skip = "cp3??t-*"
test-command = "pytest {project}/tests"
test-requires = ["pytest-cov", "pytest-rerunfailures"]


[tool.ruff]
line-length = 80
indent-width = 2
extend-include = ["*.ipynb"]
exclude = ["lib", "src/pyvinecopulib/**/__init__.pyi", "src/pyvinecopulib/__init__.pyi"]

[tool.ruff.lint]
# Broad on purpose: these have caught real defects here, so a family goes in
# unless it contradicts a convention this repository documents. `ALL` is still
# not used, and what it would add is why -- `E111` alone fires 2969 times
# objecting to the two-space indent set above, `D4xx` re-litigates docstrings
# `numpydoc` already validates, and `COM812` fights the formatter.
# `preview` lets `PYI` read `.py` files as well as stubs.
extend-select = [
  "A", "ANN", "ASYNC", "B", "BLE", "C4", "DTZ", "EXE", "FA", "FURB", "G",
  "I", "ICN", "INT", "ISC", "LOG", "NPY", "PERF", "PGH", "PIE", "PLC",
  "PLE", "PLW", "PYI", "RET", "RSE", "RUF", "SIM", "SLOT", "TC", "TRY",
  "UP", "YTT",
]
# `RUF001`/`RUF002` read a Unicode character that resembles an ASCII one as a
# probable typo. These three are the character meant: Spearman's rho, the
# multiplication sign a shape is written with, and the right single quote
# inside a quoted copy of codespell's own word regex.
allowed-confusables = ["\u03c1", "\u00d7", "\u2019"]
# Required rather than preferred: the selectors below name rules instead of
# coding them -- which `rule-codes-in-selectors` asks for and which ruff reads
# only in preview.
preview = true
ignore = [
  # Every annotation on the public surface resolves at runtime, and these
  # three break that. Measured by applying them to `vinecop_base.py` and
  # `vinedist.py`: `typing.get_type_hints` then raises `NameError` on eight
  # members -- `fit`, `select`, `matrix` and `reorient` among them -- where
  # the current tree has none anywhere. The docs build still passes, because
  # sphinx-autodoc-typehints falls back to the docstring's own type field,
  # which is what makes the breakage silent rather than loud, and leaves
  # every other consumer of `get_type_hints` with nothing. The escape hatch
  # is no answer either: `runtime-evaluated-base-classes` exempts the fields
  # of a listed base, not the functions and properties of an ordinary class.
  # `TC006` stays.
  "typing-only-first-party-import", "typing-only-third-party-import", "typing-only-standard-library-import",
  # Policy: a validation site raises a built-in with the explanatory message
  # the caller needs. This rule pushes that text into a custom exception class
  # instead; a custom class is worth defining when a caller must *distinguish*
  # a failure category, which is a design decision and not this rule's to force.
  "raise-vanilla-args",
  # A function-local import is how the layering rule is honored: `core` must
  # import with no optional extra, and `sklearn` must not name `torch` at
  # module scope. Both are stated in AGENTS.md and tested by
  # `tests/test_import_surface.py`.
  "import-outside-top-level",
  # `# noqa` is the spelling AGENTS.md documents and every other tool reads;
  # `# ruff: ignore` is a preview-only preference.
  "noqa-comments",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["undefined-local-with-import-star", "undefined-local-with-import-star-usage"]
# `ANN401` is on everywhere, and every `Any` in `src` states its reason at the
# site with a `# noqa: ANN401`. One file is the exception, because in it many
# sites share a single reason -- see the AGENTS.md rule.
# A test passes a wrong type on purpose to prove a runtime guard fires.
# `PLC2701` is AGENTS.md's own "tests import from public namespaces" rule,
# whose carve-outs are stated there -- the TLL kernels and the three plot
# modules -- and it cannot tell this package's internals from another's. The
# exemption is for the former only, which
# `test_a_private_import_outside_src_names_this_package` is what enforces:
# the allowlist of third-party privates lives there, one entry with its
# reason, so a new one is a reviewed edit rather than a silent inheritance.
# `float-equality-comparison` reads a float `==` as a probable typo. In a test
# it is usually the claim: a value the test itself set and reads back, or an
# exact guarantee rather than a computed approximation. That one reason covered
# 66 sites, which is the per-file case AGENTS.md describes rather than the same
# sentence 66 times. `src` keeps its four site-level suppressions, each of
# which has a reason of its own.
"tests/**" = ["any-type", "import-private-name", "float-equality-comparison"]
# AGENTS.md scopes the type-hint requirement to public Python source. A
# teaching notebook, a libclang-walking build helper, and Sphinx's own
# unannotated hook signatures are none of it.
"examples/**" = ["ANN"]
"scripts/**" = ["ANN", "import-private-name"]
# Both generators walk a foreign tree -- libclang's AST and nanobind's
# introspection -- where any node may raise and a node that does is
# skipped rather than fatal. That is one reason covering every site in
# each file, and the degradation is the documented contract.
"scripts/generate_docstring.py" = ["ANN", "import-private-name", "blind-except", "too-many-statements-in-try-clause"]
"scripts/generate_stubs.py" = ["ANN", "import-private-name", "blind-except"]
"docs/conf.py" = ["ANN"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
unresolved-import = "error"
# Off by default in ty; every one of these costs nothing on this tree except
# the two noted, which were fixed in the commit that turned them on.
missing-type-argument = "error"
unsound-return-statement = "error"
dynamic-function-decorator-return = "error"
blanket-ignore-comment = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"
possibly-unresolved-reference = "error"
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"

[tool.ty.analysis]
strict-equality-semantics = true
# Off: its 39 diagnostics are all `isinstance` narrowing to a top type against
# the `runtime_checkable` protocols, which is how they are meant to be used.
strict-generic-narrowing = false
# `# ty: ignore[rule]` required instead of a blanket `# type: ignore`.
respect-type-ignore-comments = false
# ty can't introspect the compiled .so; the .pyi stubs cover it.
allowed-unresolved-imports = ["pyvinecopulib.pyvinecopulib_ext"]

[tool.bandit]
# bandit is run with explicit targets (`src/pyvinecopulib scripts`) from the
# Makefile `check` target and the pre-commit hook, so no `exclude_dirs` is
# needed. (The previous `exclude_dirs = [..., "lib", ...]` silently matched
# `src/pyvinecopulib` as a substring and excluded everything.)
# B101 (assert_used): asserts are used intentionally as internal invariants in
# src and as best-effort guards in the build scripts; keep them.
skips = ["B101"]

[tool.numpydoc_validation]
# Run by pre-commit; ad-hoc with `uv run numpydoc lint src/pyvinecopulib`.
# GL01 is off: it contradicts numpydoc's own format-spec example, so both
# same-line and newline-first summaries are allowed. SS01/SS02 still require
# a capitalized summary.
checks = [
  "GL02", "GL03", "GL05", "GL07",
  "PR01", "PR02", "PR03", "PR04", "PR05", "PR07",
  "RT01", "RT04",
  "SS01", "SS02",
]
exclude = [
  # Private methods (single-underscore prefix, not dunder) inside the
  # public modules: still off-contract per the underscore-prefix rule.
  '\._[a-z][a-zA-Z0-9_]*$',
]
# Internal helpers, which are not part of any public contract. Matched by
# file path because the hook resolves modules to their `Path.stem`.
exclude_files = [
  'src/pyvinecopulib/core/_bicop_plot\.py$',
  'src/pyvinecopulib/core/_vinecop_plot\.py$',
  'src/pyvinecopulib/core/_margin_plot\.py$',
  'src/pyvinecopulib/core/_normal\.py$',
  'src/pyvinecopulib/_deprecations\.py$',
  'src/pyvinecopulib/sklearn/_base\.py$',
  'src/pyvinecopulib/torch/_vinecop_batched\.py$',
  'src/pyvinecopulib/torch/_bicop_fit_tll\.py$',
  'src/pyvinecopulib/torch/_bicop_interp\.py$',
  'src/pyvinecopulib/torch/_margin_kde1d_interp\.py$',
]

[tool.coverage.run]
source = ["src/pyvinecopulib"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Don't add `-n auto` here: xdist workers intermittently crash on GHA
# when re-importing native extensions ("node down: Not properly terminated").
addopts = [
  "--strict-markers",
  "--strict-config",
  # `compile` tests each pay a cold Inductor compilation of tens of seconds,
  # which is longer than the rest of the suite; run them with `-m compile`.
  "-m",
  "not compile",
  "--cov=src/pyvinecopulib",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-report=xml",
]
markers = [
  "flaky: mark a test as flaky and allow reruns",
  "cuda: needs a CUDA device; skipped when torch.cuda.is_available() is False",
  "compile: runs torch.compile; deselected by default (tens of seconds each)",
]
# Treat our own DeprecationWarnings as errors so internal code stays on the
# post-1.0 import paths. Matches `pyvinecopulib.NAME` and `pyvinecopulib.SUB.NAME`.
filterwarnings = [
  "error:`pyvinecopulib\\.:DeprecationWarning",
]

[tool.codespell]
# `en-GB_to_en-US` enforces the American-English rule from AGENTS.md.
builtin = "clear,rare,en-GB_to_en-US"
# The banned-word list. Each entry carries a reason after a comma, which is
# what makes codespell report a suggestion instead of auto-fixing: the right
# replacement depends on the sentence. The file must come first -- a value
# beginning with `-` is read as another flag.
dictionary = ".codespell-prose.txt,-"
# A banned word is sometimes the right word. To use one, wrap the lines in
# `codespell:ignore-begin` / `-end`, which is the form that works for every
# entry -- the single-line `codespell:ignore <word>` silently fails on a
# hyphenated one, and flags the marker itself. The markers are matched
# without anchoring to end of line, so the pair also works inside an HTML
# comment, where `<!-- codespell:ignore-begin -->` has a trailing ` -->`.
ignore-multiline-regex = "codespell:ignore-begin.*?\\n.*?codespell:ignore-end.*?\\n"
# Generated or vendored. `docstr.hpp` and the `.pyi` stubs come from upstream
# C++, so a typo there is fixed upstream. A pattern for a file at the repo
# root takes no `*/` prefix: an explicitly passed path is matched as given,
# and only a directory walk also tries the basename -- so `*/uv.lock` never
# matched the lockfile `make lint` hands it.
skip = "*/_build/*,*/_generate/*,*/_static/*,*/htmlcov/*,*/lib/*,*uv.lock,*.pyi,*/docstr.hpp,*/docs/CHANGELOG.md,*/docs/README.md,*/docs/_README_inlined.md,*/docs/examples,*.codespell-prose.txt,*test_prose.py"
# `aas` is Kjersti Aas; `fonctions` is Sklar (1959)'s title, quoted verbatim.
# The rest is domain vocabulary read as misspelled.
ignore-words-list = "aas,fonctions,nd,iff,ans,strat,te"
# Base64 payloads in notebook outputs are not prose.
ignore-regex = "[A-Za-z0-9+/]{32,}={0,2}"
