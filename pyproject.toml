[build-system]
# libclang: docstring generation. numpy/matplotlib/networkx: imported by
# the POST_BUILD stub-gen step. Mirror these in [dependency-groups].build
# below so `uv sync --group build` can populate `--no-build-isolation`
# rebuilds. libclang pinned to 18.x: PyPI's package tops out there and we
# bypass the MSVC>=19 check via -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH.
requires = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=1.14",
  "matplotlib>=3.0",
  "networkx>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyvinecopulib"
version = "1.0.0"
authors = [
  { name = "Thibault Vatter", email = "info@vinecopulib.com" },
  { name = "Thomas Nagler", email = "info@vinecopulib.com" },
]
description = "A python interface to vinecopulib"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ['numpy>=1.14', 'matplotlib>=3.0', 'networkx>=3.0', 'pydot>=3.0']
keywords = ['copula', 'vines copulas', 'pair-copulas constructions']
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Financial and Insurance Industry',
  'Intended Audience :: Healthcare Industry',
  'Intended Audience :: Information Technology',
  'Intended Audience :: Other Audience',
  'Intended Audience :: Science/Research',
  'Intended Audience :: Telecommunications Industry',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Programming Language :: C++',
  'Programming Language :: Python :: 3.9',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'License :: OSI Approved :: MIT License',
]

# Wheel-shipped extras. `sklearn` pins numpy>=2.0 for
# np.quantile(weights=...) used by VineRegressor.
[project.optional-dependencies]
examples = ["jupyterlab", "scipy"]
sklearn = ["scikit-learn>=1.4", "numpy>=2.0"]
doc = [
  "sphinx==7.0",
  "nbsphinx==0.9.2",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "sphinx-autobuild",
  "myst-parser",
]

# PEP 735 dependency groups for dev/CI. Not shipped with the wheel.
# `build` mirrors [build-system].requires plus ninja/cmake so editable
# rebuilds find their tools in the project venv. Keep in sync manually.
[dependency-groups]
build = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=1.14",
  "matplotlib>=3.0",
  "networkx>=3.0",
  "ninja",
  "cmake>=3.5",
]
test = [
  "pytest>=8.0",
  "pytest-cov",
  "pytest-rerunfailures",
  "pytest-xdist>=3.6",
  "coverage[toml]",
]
notebooks = ["nbmake", "jupyter", "nbconvert", "nbformat"]
dev = [
  "ty",
  "ruff==0.11.6",
  "pre-commit",
  "twine",
  { include-group = "build" },
]

[project.urls]
Homepage = "https://github.com/vinecopulib/pyvinecopulib/"
Documentation = "https://pyvinecopulib.readthedocs.io"
Repository = "https://github.com/vinecopulib/pyvinecopulib.git"
Issues = "https://github.com/vinecopulib/pyvinecopulib/issues"

[tool.scikit-build]
minimum-version = "0.4"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"  # stable ABI for CPython 3.12+
editable.rebuild = true
# Force scripts/** back in: scikit-build-core's default sdist exclude
# drops `build/`-named dirs, which also caught scripts/build.
sdist.include = ["scripts/**"]

[tool.cibuildwheel]
build-verbosity = 1
skip = "cp3??t-*"  # no free-threading builds
test-command = "pytest {project}/tests"
test-requires = ["pytest-cov", "pytest-rerunfailures"]
test-skip = "cp38-macosx_*:arm64"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"  # full C++17 support

[tool.ruff]
line-length = 80
indent-width = 2
extend-include = ["*.ipynb"]
# Exclude vendored libs and auto-generated stubs.
exclude = ["lib", "src/pyvinecopulib/**/__init__.pyi", "src/pyvinecopulib/__init__.pyi"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.9"

[tool.ty.rules]
# Ignore unresolved imports of the C++ extension `.so`; type info comes
# from the generated .pyi files.
unresolved-import = "ignore"

[tool.bandit]
exclude_dirs = ["tests", "docs", "examples", "lib", "build"]
skips = ["B101"]                                             # Skip assert_used test

[tool.coverage.run]
source = ["src/pyvinecopulib"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# NOTE: don't put `-n auto` here. pytest-xdist's subprocess workers
# fork+import native extensions (pyvinecopulib_ext, numpy, matplotlib,
# kiwisolver, zmq) on every test session, which intermittently crashes
# the worker on GitHub Actions runners with "node down: Not properly
# terminated" and aborts the run. Parallelism is enabled per-target in
# the Makefile (`make test`) where it's worth the trade-off; CI runs
# serially.
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=src/pyvinecopulib",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-report=xml",
]
markers = [
  "flaky: mark a test as flaky and allow reruns",
]
# Treat our own DeprecationWarnings as errors so internal code stays on the
# canonical (post-1.0) import paths. Unrelated upstream warnings (jupyter,
# matplotlib, etc.) are unaffected. The message regex matches both
# `pyvinecopulib.NAME` and `pyvinecopulib.SUBPKG.NAME` patterns we emit.
filterwarnings = [
  "error:`pyvinecopulib\\.:DeprecationWarning",
]
