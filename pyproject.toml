[build-system]
# libclang is needed at build time for the docstring generation step in
# CMakeLists.txt (scripts/build/generate_docstring.py uses clang.cindex).
# The version range is intentionally narrow so docstring output is stable
# across CI runners and end-user builds.
#
# numpy/matplotlib/networkx are also needed at build time: the CMake
# POST_BUILD step (scripts/build/generate_stubs.py) imports the freshly built
# pyvinecopulib package to walk its public API, and the package transitively
# imports these (nanobind ndarray bindings, pair_copuladata, _python_helpers).
requires = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  # PyPI's libclang package tops out at 18.x. MSVC STL on Windows wants
  # Clang >= 19, but we bypass that check by passing
  # -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH from CMakeLists.txt.
  "libclang>=18,<19",
  "numpy>=1.14",
  "matplotlib>=3.0",
  "networkx>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyvinecopulib"
version = "1.0.0"
authors = [
  { name = "Thibault Vatter", email = "info@vinecopulib.com" },
  { name = "Thomas Nagler", email = "info@vinecopulib.com" },
]
description = "A python interface to vinecopulib"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ['numpy>=1.14', 'matplotlib>=3.0', 'networkx>=3.0', 'pydot>=3.0']
keywords = ['copula', 'vines copulas', 'pair-copulas constructions']
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Financial and Insurance Industry',
  'Intended Audience :: Healthcare Industry',
  'Intended Audience :: Information Technology',
  'Intended Audience :: Other Audience',
  'Intended Audience :: Science/Research',
  'Intended Audience :: Telecommunications Industry',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Programming Language :: C++',
  'Programming Language :: Python :: 3.9',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'License :: OSI Approved :: MIT License',
]

# User-facing optional extras (ship with the wheel, installable via
# `pip install pyvinecopulib[<extra>]` or `uv sync --extra <extra>`).
[project.optional-dependencies]
examples = ["jupyterlab", "scipy"]
# Scikit-learn-compatible vine estimators (pyvinecopulib.sklearn). Pinned
# numpy>=2.0 because VineRegressor uses np.quantile(weights=...), which
# was added in NumPy 2.0.
sklearn = ["scikit-learn>=1.4", "numpy>=2.0"]
doc = [
  "sphinx==7.0",
  "nbsphinx==0.9.2",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "sphinx-autobuild",
  "myst-parser",
]

# PEP 735 dependency groups for development/CI workflows. These are NOT
# shipped with the wheel; install them with `uv sync --group <name>` (or
# pip 25+ `pip install --group <name>`). The standard local-dev workflow
# is documented in CONTRIBUTING.md.
[dependency-groups]
# Build-system deps duplicated from [build-system].requires so they are
# available under `uv sync` for `uv pip install -e . --no-build-isolation`
# and for the editable.rebuild auto-rebuild path. `ninja` and `cmake` are
# added on top of `[build-system].requires` so scikit-build-core's cached
# paths stay valid in the project venv across editable rebuilds. Keep
# in sync manually.
build = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=1.14",
  "matplotlib>=3.0",
  "networkx>=3.0",
  "ninja",
  "cmake>=3.5",
]
test = [
  "pytest>=8.0",
  "pytest-cov",
  "pytest-rerunfailures",
  "pytest-xdist>=3.6",
  "coverage[toml]",
]
notebooks = [
  "nbmake",
  "jupyter",
  "nbconvert",
  "nbformat",
]
dev = [
  # Astral's type checker (replaces mypy for toolchain consistency with ruff).
  "ty",
  "ruff==0.11.6",
  "pre-commit",
  "twine",
  { include-group = "build" },
]

[project.urls]
Homepage = "https://github.com/vinecopulib/pyvinecopulib/"
Documentation = "https://pyvinecopulib.readthedocs.io"
Repository = "https://github.com/vinecopulib/pyvinecopulib.git"
Issues = "https://github.com/vinecopulib/pyvinecopulib/issues"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

# Auto-rebuild the C++ extension on import in editable installs, so the
# regen-stubs pre-commit hook always sees fresh bindings without a manual
# reinstall. No effect on wheel builds or CI. Use:
#   pip install -e . --no-build-isolation
editable.rebuild = true

# scikit-build-core's default sdist exclude list filters out anything
# under a path named `build/` (intended for the C++ build dir). That
# also catches `scripts/build/`, which holds build-time helpers we
# absolutely need in the sdist — force them back in.
sdist.include = ["scripts/build/**"]

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

# Disable free-threading builds on all platforms
skip = "cp3??t-*"

# Run pytest to ensure that the package was correctly built. Serial
# execution — see the note in [tool.pytest.ini_options] addopts above
# for why we avoid pytest-xdist in CI.
test-command = "pytest {project}/tests"
test-requires = ["pytest-cov", "pytest-rerunfailures"]

# Don't test Python 3.8 wheels on macOS/arm64
test-skip = "cp38-macosx_*:arm64"

# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"

[tool.ruff]
line-length = 80
indent-width = 2

# Include notebooks
extend-include = ["*.ipynb"]
# Exclude vendored libs and auto-generated stub files (regenerated by
# scripts/build/generate_stubs.py; not human-edited). Glob covers the
# top-level stub and the per-subpackage stubs.
exclude = ["lib", "src/pyvinecopulib/**/__init__.pyi", "src/pyvinecopulib/__init__.pyi"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]
# "**/{tests,docs,tools}/*" = ["E402"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.9"

[tool.ty.rules]
# `from .pyvinecopulib_ext import ...` references the C++ extension shared
# library. ty can't introspect a `.so` so resolution fails; the type info
# is provided by src/pyvinecopulib/__init__.pyi which ty reads instead.
unresolved-import = "ignore"

[tool.bandit]
exclude_dirs = ["tests", "docs", "examples", "lib", "build"]
skips = ["B101"]                                             # Skip assert_used test

[tool.coverage.run]
source = ["src/pyvinecopulib"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# NOTE: don't put `-n auto` here. pytest-xdist's subprocess workers
# fork+import native extensions (pyvinecopulib_ext, numpy, matplotlib,
# kiwisolver, zmq) on every test session, which intermittently crashes
# the worker on GitHub Actions runners with "node down: Not properly
# terminated" and aborts the run. Parallelism is enabled per-target in
# the Makefile (`make test`) where it's worth the trade-off; CI runs
# serially.
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=src/pyvinecopulib",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-report=xml",
]
markers = [
  "flaky: mark a test as flaky and allow reruns",
]
# Treat our own DeprecationWarnings as errors so internal code stays on the
# canonical (post-1.0) import paths. Unrelated upstream warnings (jupyter,
# matplotlib, etc.) are unaffected. The message regex matches both
# `pyvinecopulib.NAME` and `pyvinecopulib.SUBPKG.NAME` patterns we emit.
filterwarnings = [
  "error:`pyvinecopulib\\.:DeprecationWarning",
]
