[build-system]
# Mirror [dependency-groups].build so `--no-build-isolation` rebuilds work.
requires = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=2.0",
  "matplotlib>=3.0",
  "networkx>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyvinecopulib"
version = "1.0.0"
authors = [
  { name = "Thibault Vatter", email = "info@vinecopulib.com" },
  { name = "Thomas Nagler", email = "info@vinecopulib.com" },
]
description = "A python interface to vinecopulib"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ['numpy>=2.0', 'matplotlib>=3.0', 'networkx>=3.0', 'pydot>=3.0']
keywords = ['copula', 'vines copulas', 'pair-copulas constructions']
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Financial and Insurance Industry',
  'Intended Audience :: Healthcare Industry',
  'Intended Audience :: Information Technology',
  'Intended Audience :: Other Audience',
  'Intended Audience :: Science/Research',
  'Intended Audience :: Telecommunications Industry',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Programming Language :: C++',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'License :: OSI Approved :: MIT License',
]

[project.optional-dependencies]
examples = ["jupyterlab", "scipy"]
sklearn = ["scikit-learn>=1.4", "pandas>=2.0"]
doc = [
  "sphinx==7.0",
  "nbsphinx==0.9.2",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "sphinx-autobuild",
  "myst-parser",
]

[dependency-groups]
build = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=1.14",
  "matplotlib>=3.0",
  "networkx>=3.0",
  "ninja",
  "cmake>=3.5",
]
test = [
  "pytest>=8.0",
  "pytest-cov",
  "pytest-rerunfailures",
  "pytest-xdist>=3.6",
  "coverage[toml]",
]
notebooks = ["nbmake", "jupyter", "nbconvert", "nbformat"]
dev = [
  "ty",
  "ruff==0.11.6",
  "pre-commit",
  "twine",
  { include-group = "build" },
]

[project.urls]
Homepage = "https://github.com/vinecopulib/pyvinecopulib/"
Documentation = "https://pyvinecopulib.readthedocs.io"
Repository = "https://github.com/vinecopulib/pyvinecopulib.git"
Issues = "https://github.com/vinecopulib/pyvinecopulib/issues"

[tool.scikit-build]
minimum-version = "0.4"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
editable.rebuild = true
# Pipe the rebuild output instead of streaming to sys.stderr — keeps
# notebook executions clean and lets `pytest --nbmake` run locally
# (Jupyter's OutStream doesn't implement fileno(), which the streaming
# subprocess call needs).
editable.verbose = false
# scikit-build-core's default sdist exclude drops `build/`-named dirs,
# which also catches scripts/build.
sdist.include = ["scripts/**"]

[tool.cibuildwheel]
build-verbosity = 1
skip = "cp3??t-*"
test-command = "pytest {project}/tests"
test-requires = ["pytest-cov", "pytest-rerunfailures"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"

[tool.ruff]
line-length = 80
indent-width = 2
extend-include = ["*.ipynb"]
exclude = ["lib", "src/pyvinecopulib/**/__init__.pyi", "src/pyvinecopulib/__init__.pyi"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
unresolved-import = "error"

[tool.ty.analysis]
# ty can't introspect the compiled .so; the .pyi stubs cover it.
allowed-unresolved-imports = ["pyvinecopulib.pyvinecopulib_ext"]

[tool.bandit]
exclude_dirs = ["tests", "docs", "examples", "lib", "build"]
skips = ["B101"]

[tool.coverage.run]
source = ["src/pyvinecopulib"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Don't add `-n auto` here: xdist workers intermittently crash on GHA
# when re-importing native extensions ("node down: Not properly terminated").
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=src/pyvinecopulib",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-report=xml",
]
markers = [
  "flaky: mark a test as flaky and allow reruns",
]
# Treat our own DeprecationWarnings as errors so internal code stays on the
# post-1.0 import paths. Matches `pyvinecopulib.NAME` and `pyvinecopulib.SUB.NAME`.
filterwarnings = [
  "error:`pyvinecopulib\\.:DeprecationWarning",
]
