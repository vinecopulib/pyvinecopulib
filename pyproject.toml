[build-system]
# Mirror [dependency-groups].build so `--no-build-isolation` rebuilds work.
requires = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=2.0",
  "matplotlib>=3.0",
  "networkx>=3.0",
  # Imported at build time: generate_stubs.py imports pyvinecopulib.core,
  # which imports array_api_compat (see [project].dependencies).
  "array_api_compat>=1.7",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyvinecopulib"
version = "1.0.0"
authors = [
  { name = "Thibault Vatter", email = "info@vinecopulib.com" },
  { name = "Thomas Nagler", email = "info@vinecopulib.com" },
]
description = "A python interface to vinecopulib"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  'numpy>=2.0',
  'matplotlib>=3.0',
  'networkx>=3.0',
  'pydot>=3.0',
  'array_api_compat>=1.7',
]
keywords = ['copula', 'vines copulas', 'pair-copulas constructions']
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Financial and Insurance Industry',
  'Intended Audience :: Healthcare Industry',
  'Intended Audience :: Information Technology',
  'Intended Audience :: Other Audience',
  'Intended Audience :: Science/Research',
  'Intended Audience :: Telecommunications Industry',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Programming Language :: C++',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'License :: OSI Approved :: MIT License',
]

[project.optional-dependencies]
examples = ["jupyterlab", "scipy", "xlrd>=2.0"]
sklearn = [
  "scikit-learn>=1.4",
  "pandas>=2.0",
]
torch = [
  # 2.2 is the floor for `torch.compiler.cudagraph_mark_step_begin`, which the
  # compiled cascade calls before each graph replay; `nn.Module.__getstate__`,
  # which `TorchVinecop` delegates to, needs 2.1.
  "torch>=2.2",
]
scipy = [
  # 1.16 is the first release to require Python 3.11, so it is the floor this
  # package's own floor admits; it carries the modern `scipy.stats`
  # distribution classes that `pyvinecopulib.margins.as_margin` adapts. The
  # parametric margins still go through the legacy `rv_continuous.fit`
  # surface, which is much older.
  "scipy>=1.16",
]
openturns = [
  # An extra rather than a dependency on two counts: OpenTURNS is LGPL where
  # this package is MIT, and its wheel is ~60 MB. 1.16 is the floor for
  # `FittingTest.AICC`, one of the three criteria `OpenTURNSMargin.select` offers.
  "openturns>=1.16",
]
doc = [
  # Ranges, not exact pins: `sphinx==7.0` held `sphinx-autodoc-typehints` back
  # to its 2023 releases while the other four floated, so whichever of them
  # raised its Sphinx floor first would break the build with no change here.
  # `make docs` runs with `-W` and nitpicky mode, which is the real guard.
  # The 8.x ceiling is not arbitrary: under Sphinx 8 the current
  # `sphinx-autodoc-typehints` emits a stray `*` into every autosummary entry,
  # so each one raises "Inline emphasis start-string without end-string".
  "sphinx>=7,<8",
  "nbsphinx>=0.9,<0.10",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "myst-parser",
  "numpydoc>=1.7",
]

[dependency-groups]
build = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=1.14",
  "matplotlib>=3.0",
  "networkx>=3.0",
  "array_api_compat>=1.7",
  "ninja",
  "cmake>=3.14",
]
test = [
  "pytest>=8.0",
  "pytest-cov",
  "pytest-rerunfailures",
  "pytest-xdist>=3.6",
  "coverage[toml]",
]
notebooks = ["nbmake", "jupyter", "nbconvert", "nbformat"]
dev = [
  "ty",
  "codespell[toml]",
  "ruff==0.11.6",
  "bandit[toml]==1.9.4",
  "pre-commit",
  "twine",
  { include-group = "build" },
]

[project.urls]
Homepage = "https://github.com/vinecopulib/pyvinecopulib/"
Documentation = "https://pyvinecopulib.readthedocs.io"
Repository = "https://github.com/vinecopulib/pyvinecopulib.git"
Issues = "https://github.com/vinecopulib/pyvinecopulib/issues"

[tool.scikit-build]
minimum-version = "0.4"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
editable.rebuild = true
# Pipe the rebuild output instead of streaming to sys.stderr — keeps
# notebook executions clean and lets `pytest --nbmake` run locally
# (Jupyter's OutStream doesn't implement fileno(), which the streaming
# subprocess call needs).
editable.verbose = false
# scikit-build-core's default sdist exclude drops `build/`-named dirs,
# which also catches scripts/build.
# Extension-scoped rather than `scripts/**`: a force-include outranks
# `sdist.exclude`, so the directory glob shipped `scripts/__pycache__/*.pyc`.
sdist.include = [
  "scripts/*.py",
  "scripts/*.sh",
  "scripts/*.ipynb",
  "scripts/*.json",
]
sdist.exclude = [
  "build*/**",
  "**/__pycache__/**",
  "**/*.pyc",
]

[tool.cibuildwheel]
build-verbosity = 1
skip = "cp3??t-*"
test-command = "pytest {project}/tests"
test-requires = ["pytest-cov", "pytest-rerunfailures"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"

[tool.ruff]
line-length = 80
indent-width = 2
extend-include = ["*.ipynb"]
exclude = ["lib", "src/pyvinecopulib/**/__init__.pyi", "src/pyvinecopulib/__init__.pyi"]

[tool.ruff.lint]
# These sets complement `ty` instead of restating conventions AGENTS.md
# already states, which is why `ALL` is not used. `preview` lets `PYI` read
# `.py` files as well as stubs.
extend-select = ["ANN", "TC", "PYI", "PGH003", "RUF045", "RUF100"]
preview = true
# Annotations resolve at runtime here -- the docs build reads them through
# sphinx-autodoc-typehints -- so moving an import behind `TYPE_CHECKING` makes
# the signature that uses it unresolvable. `TC006` stays.
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]
# `ANN401` is on everywhere, and every `Any` in `src` states its reason at the
# site with a `# noqa: ANN401`. These two files are the exception, because in
# each one many sites share a single reason -- see the AGENTS.md rule.
# `DiscretePair`'s private helpers compute difference quotients on array
# columns, which an unbounded `ArrayT` cannot type.
"src/pyvinecopulib/core/_vinecop_discrete.py" = ["ANN401"]
# OpenTURNS is SWIG-generated: no `py.typed` and no stub package.
"src/pyvinecopulib/margins/openturns.py" = ["ANN401"]
# A test passes a wrong type on purpose to prove a runtime guard fires.
"tests/**" = ["ANN401"]
# AGENTS.md scopes the type-hint requirement to public Python source. A
# teaching notebook, a libclang-walking build helper, and Sphinx's own
# unannotated hook signatures are none of it.
"examples/**" = ["ANN"]
"scripts/**" = ["ANN"]
"docs/conf.py" = ["ANN"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
unresolved-import = "error"
# Off by default in ty; every one of these costs nothing on this tree except
# the two noted, which were fixed in the commit that turned them on.
missing-type-argument = "error"
unsound-return-statement = "error"
dynamic-function-decorator-return = "error"
blanket-ignore-comment = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"
possibly-unresolved-reference = "error"
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"

[tool.ty.analysis]
strict-equality-semantics = true
# Off: its 39 diagnostics are all `isinstance` narrowing to a top type against
# the `runtime_checkable` protocols, which is how they are meant to be used.
strict-generic-narrowing = false
# `# ty: ignore[rule]` required instead of a blanket `# type: ignore`.
respect-type-ignore-comments = false
# ty can't introspect the compiled .so; the .pyi stubs cover it.
allowed-unresolved-imports = ["pyvinecopulib.pyvinecopulib_ext"]

[tool.bandit]
# bandit is run with explicit targets (`src/pyvinecopulib scripts`) from the
# Makefile `check` target and the pre-commit hook, so no `exclude_dirs` is
# needed. (The previous `exclude_dirs = [..., "lib", ...]` silently matched
# `src/pyvinecopulib` as a substring and excluded everything.)
# B101 (assert_used): asserts are used intentionally as internal invariants in
# src and as best-effort guards in the build scripts; keep them.
skips = ["B101"]

[tool.numpydoc_validation]
# Run by pre-commit; ad-hoc with `uv run numpydoc lint src/pyvinecopulib`.
# GL01 is off: it contradicts numpydoc's own format-spec example, so both
# same-line and newline-first summaries are allowed. SS01/SS02 still require
# a capitalized summary.
checks = [
  "GL02", "GL03", "GL05", "GL07",
  "PR01", "PR02", "PR03", "PR04", "PR05", "PR07",
  "RT01", "RT04",
  "SS01", "SS02",
]
exclude = [
  # Private methods (single-underscore prefix, not dunder) inside the
  # public modules: still off-contract per the underscore-prefix rule.
  '\._[a-z][a-zA-Z0-9_]*$',
]
# Internal helpers, which are not part of any public contract. Matched by
# file path because the hook resolves modules to their `Path.stem`.
exclude_files = [
  'src/pyvinecopulib/_python_helpers/.*\.py$',
  'src/pyvinecopulib/_deprecations\.py$',
  'src/pyvinecopulib/sklearn/_base\.py$',
  'src/pyvinecopulib/torch/_vinecop_batched\.py$',
  'src/pyvinecopulib/torch/_bicop_fit_tll\.py$',
  'src/pyvinecopulib/torch/_bicop_interp\.py$',
  'src/pyvinecopulib/torch/_margin_kde1d_interp\.py$',
]

[tool.coverage.run]
source = ["src/pyvinecopulib"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Don't add `-n auto` here: xdist workers intermittently crash on GHA
# when re-importing native extensions ("node down: Not properly terminated").
addopts = [
  "--strict-markers",
  "--strict-config",
  # `compile` tests each pay a cold Inductor compilation of tens of seconds,
  # which is longer than the rest of the suite; run them with `-m compile`.
  "-m",
  "not compile",
  "--cov=src/pyvinecopulib",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-report=xml",
]
markers = [
  "flaky: mark a test as flaky and allow reruns",
  "cuda: needs a CUDA device; skipped when torch.cuda.is_available() is False",
  "compile: runs torch.compile; deselected by default (tens of seconds each)",
]
# Treat our own DeprecationWarnings as errors so internal code stays on the
# post-1.0 import paths. Matches `pyvinecopulib.NAME` and `pyvinecopulib.SUB.NAME`.
filterwarnings = [
  "error:`pyvinecopulib\\.:DeprecationWarning",
]

[tool.codespell]
# `en-GB_to_en-US` enforces the American-English rule from AGENTS.md.
builtin = "clear,rare,en-GB_to_en-US"
# The banned-word list. Each entry carries a reason after a comma, which is
# what makes codespell report a suggestion instead of auto-fixing: the right
# replacement depends on the sentence. The file must come first -- a value
# beginning with `-` is read as another flag.
dictionary = ".codespell-prose.txt,-"
# A banned word is sometimes the right word. To use one, wrap the lines in
# `# codespell:ignore-begin` / `-end`, which is the form that works for every
# entry -- the single-line `# codespell:ignore <word>` silently fails on a
# hyphenated one, and flags the marker itself.
ignore-multiline-regex = "codespell:ignore-begin *\\n.*?codespell:ignore-end *\\n"
# Generated or vendored. `docstr.hpp` and the `.pyi` stubs come from upstream
# C++, so a typo there is fixed upstream.
skip = "*/_build/*,*/_generate/*,*/_static/*,*/htmlcov/*,*/lib/*,*/uv.lock,*.pyi,*/docstr.hpp,*/docs/CHANGELOG.md,*/docs/README.md,*/docs/_README_inlined.md,*/docs/examples,*.codespell-prose.txt,*test_prose.py"
# `aas` is Kjersti Aas; `fonctions` is Sklar (1959)'s title, quoted verbatim.
# The rest is domain vocabulary read as misspelled.
ignore-words-list = "aas,fonctions,nd,iff,ans,strat,te"
# Base64 payloads in notebook outputs are not prose.
ignore-regex = "[A-Za-z0-9+/]{32,}={0,2}"
