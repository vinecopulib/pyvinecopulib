[build-system]
# Mirror [dependency-groups].build so `--no-build-isolation` rebuilds work.
requires = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=2.0",
  "matplotlib>=3.0",
  "networkx>=3.0",
  # Imported at build time: generate_stubs.py imports pyvinecopulib.core,
  # which imports array_api_compat (see [project].dependencies).
  "array_api_compat>=1.7",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyvinecopulib"
version = "1.0.0"
authors = [
  { name = "Thibault Vatter", email = "info@vinecopulib.com" },
  { name = "Thomas Nagler", email = "info@vinecopulib.com" },
]
description = "A python interface to vinecopulib"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  'numpy>=2.0',
  'matplotlib>=3.0',
  'networkx>=3.0',
  'pydot>=3.0',
  'array_api_compat>=1.7',
]
keywords = ['copula', 'vines copulas', 'pair-copulas constructions']
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Financial and Insurance Industry',
  'Intended Audience :: Healthcare Industry',
  'Intended Audience :: Information Technology',
  'Intended Audience :: Other Audience',
  'Intended Audience :: Science/Research',
  'Intended Audience :: Telecommunications Industry',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Programming Language :: C++',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'License :: OSI Approved :: MIT License',
]

[project.optional-dependencies]
examples = ["jupyterlab", "scipy", "xlrd>=2.0"]
sklearn = [
  "scikit-learn>=1.4",
  "pandas>=2.0",
]
torch = [
  # 2.2 is the floor for `torch.compiler.cudagraph_mark_step_begin`, which the
  # compiled cascade calls before each graph replay; `nn.Module.__getstate__`,
  # which `TorchVinecop` delegates to, needs 2.1.
  "torch>=2.2",
]
scipy = [
  # 1.16 is the first release to require Python 3.11, so it is the floor this
  # package's own floor admits; it carries the modern `scipy.stats`
  # distribution classes that `pyvinecopulib.margins.as_margin` adapts. The
  # parametric margins still go through the legacy `rv_continuous.fit`
  # surface, which is much older.
  "scipy>=1.16",
]
openturns = [
  # An extra rather than a dependency on two counts: OpenTURNS is LGPL where
  # this package is MIT, and its wheel is ~60 MB. 1.16 is the floor for
  # `FittingTest.AICC`, one of the three criteria `OpenTURNSMargin.select` offers.
  "openturns>=1.16",
]
doc = [
  # Ranges, not exact pins: `sphinx==7.0` held `sphinx-autodoc-typehints` back
  # to its 2023 releases while the other four floated, so whichever of them
  # raised its Sphinx floor first would break the build with no change here.
  # `make docs` runs with `-W` and nitpicky mode, which is the real guard.
  # The 8.x ceiling is not arbitrary: under Sphinx 8 the current
  # `sphinx-autodoc-typehints` emits a stray `*` into every autosummary entry,
  # so each one raises "Inline emphasis start-string without end-string".
  "sphinx>=7,<8",
  "nbsphinx>=0.9,<0.10",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "myst-parser",
  "numpydoc>=1.7",
]

[dependency-groups]
build = [
  "scikit-build-core>=0.5.0",
  "nanobind>=2.7.0",
  "libclang>=18,<19",
  "numpy>=1.14",
  "matplotlib>=3.0",
  "networkx>=3.0",
  "array_api_compat>=1.7",
  "ninja",
  "cmake>=3.14",
]
test = [
  "pytest>=8.0",
  "pytest-cov",
  "pytest-rerunfailures",
  "pytest-xdist>=3.6",
  "coverage[toml]",
]
notebooks = ["nbmake", "jupyter", "nbconvert", "nbformat"]
dev = [
  "ty",
  "codespell[toml]",
  "ruff==0.11.6",
  "bandit[toml]==1.9.4",
  "pre-commit",
  "twine",
  { include-group = "build" },
]

[project.urls]
Homepage = "https://github.com/vinecopulib/pyvinecopulib/"
Documentation = "https://pyvinecopulib.readthedocs.io"
Repository = "https://github.com/vinecopulib/pyvinecopulib.git"
Issues = "https://github.com/vinecopulib/pyvinecopulib/issues"

[tool.scikit-build]
minimum-version = "0.4"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
editable.rebuild = true
# Pipe the rebuild output instead of streaming to sys.stderr — keeps
# notebook executions clean and lets `pytest --nbmake` run locally
# (Jupyter's OutStream doesn't implement fileno(), which the streaming
# subprocess call needs).
editable.verbose = false
# scikit-build-core's default sdist exclude drops `build/`-named dirs,
# which also catches scripts/build.
# Extension-scoped rather than `scripts/**`: a force-include outranks
# `sdist.exclude`, so the directory glob shipped `scripts/__pycache__/*.pyc`.
sdist.include = [
  "scripts/*.py",
  "scripts/*.sh",
  "scripts/*.ipynb",
  "scripts/*.json",
]
sdist.exclude = [
  "build*/**",
  "**/__pycache__/**",
  "**/*.pyc",
]

[tool.cibuildwheel]
build-verbosity = 1
skip = "cp3??t-*"
test-command = "pytest {project}/tests"
test-requires = ["pytest-cov", "pytest-rerunfailures"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"

[tool.ruff]
line-length = 80
indent-width = 2
extend-include = ["*.ipynb"]
exclude = ["lib", "src/pyvinecopulib/**/__init__.pyi", "src/pyvinecopulib/__init__.pyi"]

[tool.ruff.lint]
# Ruff ran its defaults (`E4,E7,E9,F`) until 1.0.0. These four sets are the
# ones that complement `ty` rather than restating this repository's own
# conventions: annotations, type-checking hygiene, stub correctness, and the
# blanket-`type: ignore` check. `preview` is what lets `PYI` inspect `.py`
# files as well as stubs.
#
# Not adopted, and why, so it is not re-litigated: `ALL` reports 7851, and its
# largest entries contradict rules AGENTS.md states -- `UP007` wants
# `X | None` where `Optional[X]` is used consistently and on purpose,
# `TID252` forbids the relative imports the layering rests on, and
# `TRY003`/`EM101`/`EM102` want short exception messages, which this
# codebase does not write. Adopting it would mean an ignore list
# restating the spec.
extend-select = ["ANN", "TC", "PYI", "PGH003", "RUF045"]
preview = true
# `TC006` (quote a runtime `cast` target) is the half of flake8-type-checking
# this codebase wants; the three import-movement rules are wrong here.
# Annotations are resolved **at runtime** in two places -- the docs build,
# through sphinx-autodoc-typehints, and
# `tests/test_import_surface.py::test_the_fit_callback_aliases_resolve_from_any_module`
# -- so moving e.g. `RVineStructure` behind `TYPE_CHECKING` would leave
# `VinecopBase.fit`'s own signature unresolvable. That test exists because a
# quoted alias had already broken the docs build once.
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]
# `ANN401` (a parameter or return annotated `Any`) is enforced everywhere
# except where `Any` is the answer. Each entry below is a place the type
# cannot be narrowed, not a place nobody got round to:
#
# `core/_discrete.py` and the two big bases evaluate array *values* -- they
# subtract, divide, mask and index them -- and `ArrayT` is an unbounded
# TypeVar, so it names no operator, no `.shape` and no `__getitem__`.
# `array_api_compat` publishes no `Array` protocol to bound it with, and
# bounding it would close the extension point the contracts advertise.
"src/pyvinecopulib/core/_discrete.py" = ["ANN401"]
"src/pyvinecopulib/core/vinecop_base.py" = ["ANN401"]
"src/pyvinecopulib/core/vinedist_base.py" = ["ANN401"]
# The placement layer's whole job is to accept an array from any namespace and
# put it on another; typing its input would defeat it.
"src/pyvinecopulib/core/_placement.py" = ["ANN401"]
"src/pyvinecopulib/core/_covariates.py" = ["ANN401"]
"src/pyvinecopulib/core/_trim.py" = ["ANN401"]
"src/pyvinecopulib/core/_rootfind.py" = ["ANN401"]
# The four protocols' `**kwargs`, forwarded to whatever the held object
# accepts, and the resolution helpers that take any of five documented spec
# shapes.
"src/pyvinecopulib/core/protocols.py" = ["ANN401"]
"src/pyvinecopulib/core/_resolve.py" = ["ANN401"]
"src/pyvinecopulib/core/_validation.py" = ["ANN401"]
"src/pyvinecopulib/core/_engines.py" = ["ANN401"]
"src/pyvinecopulib/core/margin_base.py" = ["ANN401"]
"src/pyvinecopulib/core/vinedist.py" = ["ANN401"]
# The backend layer holds either a `Vinecop` or a `TorchVinecop` and the
# estimators accept any of the documented `margins=` spec shapes.
"src/pyvinecopulib/sklearn/backends.py" = ["ANN401"]
"src/pyvinecopulib/sklearn/_base.py" = ["ANN401"]
# `nn.Module` members torch leaves untyped upstream, plus the batched state,
# which only the torch lane knows the shape of.
"src/pyvinecopulib/torch/vinecop.py" = ["ANN401"]
"src/pyvinecopulib/torch/vinedist.py" = ["ANN401"]
"src/pyvinecopulib/torch/kde1d.py" = ["ANN401"]
"src/pyvinecopulib/torch/tll_bicop.py" = ["ANN401"]
"src/pyvinecopulib/torch/distribution_margin.py" = ["ANN401"]
"src/pyvinecopulib/torch/_placement.py" = ["ANN401"]
# The one place a foreign object's type is unknowable: `as_margin`'s funnel.
"src/pyvinecopulib/margins/openturns.py" = ["ANN401"]
# The deprecation shim resolves an arbitrary name to a class, a function or a
# subpackage, and the plotting glue is handed matplotlib objects.
"src/pyvinecopulib/_deprecations.py" = ["ANN401"]
# The top-level `__getattr__` resolves a name to a class, a function or a
# subpackage, which is what `Any` means.
"src/pyvinecopulib/__init__.py" = ["ANN401"]
"src/pyvinecopulib/_python_helpers/bicop.py" = ["ANN401"]
"src/pyvinecopulib/utils/__init__.py" = ["ANN401"]
# A test may pass a wrong type on purpose to prove a runtime guard fires, and
# a fixture may traffic in whatever the object under test accepts.
"tests/**" = ["ANN401"]
# AGENTS.md scopes the type-hint requirement to "public Python source", and
# these three are not that:
#
# A notebook cell is read by someone learning the library, and
# `def kendall_tau(data, weights)` teaches better than the annotated form.
# Correctness is covered instead by executing every notebook in CI.
"examples/**" = ["ANN"]
# Benchmark and build-helper scripts: internal tooling with no importers, and
# `scripts/generate_docstring.py` walks libclang cursors, which are `Any` to
# any checker.
"scripts/**" = ["ANN"]
# `docs/conf.py` is a Sphinx configuration module whose functions are called
# by Sphinx through documented but unannotated hook signatures (`app`, `what`,
# `obj`, `options`, `lines`), so annotating them would restate Sphinx's own
# untyped API.
"docs/conf.py" = ["ANN"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
unresolved-import = "error"
# Off by default in ty; every one of these costs nothing on this tree except
# the two noted, which were fixed in the commit that turned them on.
missing-type-argument = "error"
unsound-return-statement = "error"
dynamic-function-decorator-return = "error"
blanket-ignore-comment = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"
possibly-unresolved-reference = "error"
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"

[tool.ty.analysis]
# Conservative inference: no narrowing a `str` to a `Literal` on `==`, and
# `isinstance` narrows to a top type rather than a gradual one.
strict-equality-semantics = true
# strict-generic-narrowing is left off: it costs 39 diagnostics here, all of
# them `isinstance` narrowing to a top type in code written against the
# `runtime_checkable` protocols, which is the design rather than a defect.
strict-generic-narrowing = false
# `# type: ignore` no longer silences ty; `# ty: ignore[rule]` is required,
# which is the narrow-and-justified form AGENTS.md already asks for.
respect-type-ignore-comments = false
# ty can't introspect the compiled .so; the .pyi stubs cover it.
allowed-unresolved-imports = ["pyvinecopulib.pyvinecopulib_ext"]

[tool.bandit]
# bandit is run with explicit targets (`src/pyvinecopulib scripts`) from the
# Makefile `check` target and the pre-commit hook, so no `exclude_dirs` is
# needed. (The previous `exclude_dirs = [..., "lib", ...]` silently matched
# `src/pyvinecopulib` as a substring and excluded everything.)
# B101 (assert_used): asserts are used intentionally as internal invariants in
# src and as best-effort guards in the build scripts; keep them.
skips = ["B101"]

[tool.numpydoc_validation]
# Public-API docstrings follow the numpydoc spec
# (https://numpydoc.readthedocs.io/en/latest/format.html). Enforced via
# `pre-commit run numpydoc-validation` and runnable ad-hoc with
# `uv run numpydoc lint src/pyvinecopulib`.
#
# Active check codes (see https://numpydoc.readthedocs.io/en/latest/validation.html).
# GL01 (summary must start on the line after the opening triple-quote)
# is OFF: it's opinionated, contradicts numpydoc's own format-spec
# example (`"""Short summary."""`), and major projects (scikit-learn) sit
# on the other side. We allow both same-line and newline-first
# summaries; SS01/SS02 still enforce that the summary exists and starts
# capitalized.
checks = [
  "GL02", "GL03", "GL05", "GL07",
  "PR01", "PR02", "PR03", "PR04", "PR05", "PR07",
  "RT01", "RT04",
  "SS01", "SS02",
]
exclude = [
  # Private methods (single-underscore prefix, not dunder) inside the
  # public modules: still off-contract per the underscore-prefix rule.
  '\._[a-z][a-zA-Z0-9_]*$',
]
# File-path patterns for internal helpers (AGENTS.md §"Module boundaries"):
# not part of any public contract. The numpydoc hook resolves modules to
# their `Path.stem`, so we match by file path here rather than by dotted
# module name.
exclude_files = [
  'src/pyvinecopulib/_python_helpers/.*\.py$',
  'src/pyvinecopulib/_deprecations\.py$',
  'src/pyvinecopulib/sklearn/_base\.py$',
  'src/pyvinecopulib/torch/_batched\.py$',
  'src/pyvinecopulib/torch/_fit_tll\.py$',
  'src/pyvinecopulib/torch/_interp\.py$',
  'src/pyvinecopulib/torch/_kde1d_interp\.py$',
]

[tool.coverage.run]
source = ["src/pyvinecopulib"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Don't add `-n auto` here: xdist workers intermittently crash on GHA
# when re-importing native extensions ("node down: Not properly terminated").
addopts = [
  "--strict-markers",
  "--strict-config",
  # `compile` tests each pay a cold Inductor compilation of tens of seconds,
  # which is longer than the rest of the suite; run them with `-m compile`.
  "-m",
  "not compile",
  "--cov=src/pyvinecopulib",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-report=xml",
]
markers = [
  "flaky: mark a test as flaky and allow reruns",
  "cuda: needs a CUDA device; skipped when torch.cuda.is_available() is False",
  "compile: runs torch.compile; deselected by default (tens of seconds each)",
]
# Treat our own DeprecationWarnings as errors so internal code stays on the
# post-1.0 import paths. Matches `pyvinecopulib.NAME` and `pyvinecopulib.SUB.NAME`.
filterwarnings = [
  "error:`pyvinecopulib\\.:DeprecationWarning",
]

[tool.codespell]
# `en-GB_to_en-US` is what enforces the American-English rule from AGENTS.md;
# the rest catches ordinary typos in the same pass.
builtin = "clear,rare,en-GB_to_en-US"
# The prose rule beside the spelling one: a banned word reports with a
# suggestion and, because each entry carries a reason after a comma, is never
# auto-fixed -- the right replacement depends on the sentence.
dictionary = ".codespell-prose.txt,-"
# Generated or vendored: `docstr.hpp` and the `.pyi` stubs are build artifacts
# whose text comes from upstream C++ (fix it there), and `lib/` is upstream.
# `make lint` additionally passes the paths we own explicitly, because CI
# unpacks Eigen and Boost into the workspace and a skip list cannot anticipate
# every directory a build step drops there.
skip = "*/_build/*,*/_generate/*,*/_static/*,*/htmlcov/*,*/lib/*,*/uv.lock,*.pyi,*/docstr.hpp,*/docs/CHANGELOG.md,*/docs/README.md,*/docs/_README_inlined.md,*/docs/examples,*.codespell-prose.txt,*test_prose.py"
# `aas` is Kjersti Aas, author of the paper the vine literature is built on.
# The rest are domain vocabulary or identifiers read as misspellings.
# `fonctions` is Sklar (1959)'s French title, quoted verbatim in the references.
ignore-words-list = "aas,fonctions,nd,iff,ans,strat,te"
# Base64 payloads in notebook outputs are not prose.
ignore-regex = "[A-Za-z0-9+/]{32,}={0,2}"
