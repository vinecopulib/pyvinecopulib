name: Build Status

on:
  push:
    branches: [main]
    tags: ['v*']
  # No branch filter: a stacked pull request targets the branch below it and
  # needs the matrix as much as one targeting main.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: Publish the built artifacts to Test PyPI (release rehearsal)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BOOST_VERSION: 1.84.0
  EIGEN_VERSION: 3.4.0
  EXPECTED_WHEEL_COUNT: 10  # 5 platforms × cp311/cp312-ABI3

jobs:

  lint:
    # Gates the wheel matrix: 10 cibuildwheel legs should not start behind a
    # formatting error. `ty` is not here — it reads the .pyi stubs a build
    # generates, so it stays in `build_sdist` where the editable install exists.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install lint tooling
        run: uv sync --no-install-project --group dev
      - name: Lint, format-check, and security-lint
        env:
          UV_NO_SYNC: "1"
        run: make lint
      - name: Check the version metadata agrees
        run: python3 scripts/check_version.py

  build:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the Intel runner, macos-15 is Apple silicon.
        python: [311, 312]
        cfg:
          - {
              os: ubuntu-latest,
              cibw_id: manylinux_x86_64,
              cc: gcc,
              cxx: g++,
              platform: x64,
              root_install_dir: "/home/runner/work",
            }
          - {
              os: ubuntu-latest,
              cibw_id: musllinux_x86_64,
              cc: gcc,
              cxx: g++,
              platform: x64,
              root_install_dir: "/home/runner/work",
            }
          - {
              os: macos-15-intel,
              cibw_id: macosx_x86_64,
              cc: clang,
              cxx: clang++,
              platform: x64,
              root_install_dir: "/Users/runner/work",
              macos_target: "10.13",
            }
          - {
              os: macos-15,
              cibw_id: macosx_arm64,
              cc: clang,
              cxx: clang++,
              platform: arm64,
              root_install_dir: "/Users/runner/work",
              macos_target: "11.0",
            }
          - {
              os: windows-latest,
              cibw_id: win_amd64,
              cc: cl,
              cxx: cl,
              platform: x64,
              root_install_dir: 'D:\',
            }

    name: Build and test on ${{ matrix.cfg.os }} for cp${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Get history and tags for SCM versioning to work
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Set up Python 3.11
        # Host Python for `uvx twine check`; cibw uses its own per-wheel Pythons.
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install C++ dependencies
        id: install-dependencies
        # Pinned to a SHA, not a branch: upstream deleted `dev` out from under
        # this reference, and a moving ref lets upstream CI churn break wheels.
        uses: vinecopulib/vinecopulib/.github/actions/install-dependencies@f43820efd16474ec930b5022df54e15cfe02466d
        with:
          os: ${{ matrix.cfg.os }}
          platform: ${{ matrix.cfg.platform }}
          boost_install_dir: ${{ matrix.cfg.root_install_dir }}
          eigen_install_dir: ${{ matrix.cfg.root_install_dir }}
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          # wdm and kde1d ship as lib/ submodules; lcov is only for C++ coverage.
          wdm: "false"
          lcov: "false"
          # The action's default apt-installs g++/clang on the host. cibuildwheel
          # compiles inside the manylinux/musllinux container with its own
          # toolchain, and the other ubuntu jobs only install prebuilt wheels, so
          # the host compilers are never used -- and that apt call has hung the
          # job repeatedly.
          update_compilers_ubuntu: "false"
      - name: Clean build artifacts
        shell: bash
        run: |
          rm -rf build wheelhouse
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_REBUILD: 1
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
          # Eigen is built from source into root_install_dir on every OS, so its
          # headers are at <root_install_dir>include\eigen3. Windows'
          # root_install_dir already ends in a backslash — do not add one.
          CIBW_ENVIRONMENT_WINDOWS: Boost_INCLUDE_DIR='${{steps.install-dependencies.outputs.BOOST_ROOT}}\include' EIGEN3_INCLUDE_DIR='${{matrix.cfg.root_install_dir}}include\eigen3'
          # MACOSX_DEPLOYMENT_TARGET >= 10.13 is required by nanobind's aligned
          # operator new/delete (the x86_64 default is 10.9). arm64 uses 11.0.
          CIBW_ENVIRONMENT_MACOS: "Boost_INCLUDE_DIR=${{steps.install-dependencies.outputs.BOOST_ROOT}}/include EIGEN3_INCLUDE_DIR=${{matrix.cfg.root_install_dir}}/include/eigen3 MACOSX_DEPLOYMENT_TARGET=${{matrix.cfg.macos_target}}"
          CIBW_ENVIRONMENT_LINUX: "Boost_INCLUDE_DIR=/host${{steps.install-dependencies.outputs.BOOST_ROOT}}/include EIGEN3_INCLUDE_DIR=/host${{matrix.cfg.root_install_dir}}/include/eigen3"
          CIBW_ENVIRONMENT_PASS_LINUX: "Boost_INCLUDE_DIR EIGEN3_INCLUDE_DIR"
      - name: Inspect built wheel contents
        shell: bash
        run: |
          wheel=$(ls wheelhouse/*.whl)
          unzip -t "$wheel" >/dev/null || {
            echo "::error file=$wheel::Corrupted or invalid wheel archive"
            exit 1
          }
          unzip -l "$wheel" | grep -E '(__init__\.pyi|py\.typed)' || {
            echo "::error ::Expected stub or marker files not found in $wheel"
            exit 1
          }
          uvx --quiet twine check --strict wheelhouse/*.whl || {
            echo "::error ::Metadata check failed — would fail on PyPI upload."
            exit 1
          }
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.cfg.os }}-${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
          path: ./wheelhouse/*.whl

  check_wheels:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      actions: read
      contents: read

    name: Verify all built wheels

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Download cibw artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
        continue-on-error: true
      - name: Verify downloaded wheel integrity and metadata
        run: |
          N_WHEELS=$(find dist -type f -name '*.whl' | wc -l)
          N_EXPECTED=${EXPECTED_WHEEL_COUNT:-0}
          echo "Found $N_WHEELS wheel(s); expected $N_EXPECTED"

          if [ "$N_WHEELS" -ne "$N_EXPECTED" ]; then
            echo "::error ::Expected $N_EXPECTED wheels, found $N_WHEELS."
            ls -1 dist/
            exit 1
          fi

          find dist -type f -name '*.whl' -printf "%P\n" | sort
          uvx --quiet twine check --strict dist/* || {
            echo "::error ::Metadata check failed — would fail on PyPI upload."
            exit 1
          }

  verify_docs_build:
    # RTD mirror against the PR's wheel; `-W` catches doc regressions pre-tag.
    name: Verify docs build (RTD mirror)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Graphviz + Pandoc
        # `dot` renders the vine-structure graphs in the examples; nbsphinx
        # shells out to pandoc to convert the notebooks it embeds.
        uses: ./.github/actions/install-graphviz
        with:
          pandoc: "true"
      - name: Download built wheel (cp311 manylinux ubuntu)
        uses: actions/download-artifact@v8
        with:
          name: cibw-wheels-ubuntu-latest-311-manylinux_x86_64
          path: dist/
      - name: Install wheel + doc/examples/sklearn/torch extras
        # `[sklearn]`/`[torch]` are needed for autosummary to introspect
        # pyvinecopulib.sklearn / pyvinecopulib.torch.
        run: |
          uv venv --python 3.11
          WHEEL=$(ls dist/*.whl)
          uv pip install "${WHEEL}[doc,examples,sklearn,torch]"
      - name: Build HTML docs (warnings as errors)
        env:
          UV_NO_SYNC: "1"
        run: make docs
      - name: Upload built HTML for PR review
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html/
          retention-days: 14

  install_and_unit_test:
    needs: build
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: [311, 312, 313, 314]
        cfg:
          # macos-15-intel wheels are built + published by the `build` job, but
          # are NOT unit-tested here: PyTorch has no x86_64-macOS wheel, so the
          # `test_torch_*` half of the suite cannot run on that platform.
          - { os: ubuntu-latest, cibw_id: manylinux_x86_64 }
          - { os: macos-15, cibw_id: macosx_arm64 }
          - { os: windows-latest, cibw_id: win_amd64 }
    name: Install wheel and run unit tests on ${{ matrix.cfg.os }} for cp${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Infer full Python version
        id: pyver
        shell: bash
        run: |
          short="${{ matrix.python }}"
          major="${short:0:1}"
          minor="${short:1}"
          echo "version=$major.$minor" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install Graphviz
        # The notebooks draw vine structures through `dot`.
        uses: ./.github/actions/install-graphviz
      - name: Create uv venv and install test/notebooks deps
        # --no-install-project: we test the cibw wheel, not a source build.
        #
        # `openturns` is skipped on macOS: its single `cp39-abi3` wheel brings its
        # own OpenMP runtime, and co-resident with torch's the process dies with
        # SIGSEGV inside `int_on_grid_batched` on every arm64 Python (cp311,
        # cp313 and cp314 measured; the same legs pass without the extra, and
        # ubuntu and windows pass with it). The adapter is exercised on those eight
        # legs; keeping torch on macOS matters more, since torch-vs-C++ parity is
        # a hard guarantee and macOS arm64 is a first-class torch platform.
        shell: bash
        run: |
          uv venv --python ${{ steps.pyver.outputs.version }}
          extras="--extra examples --extra sklearn --extra torch"
          if [ "$RUNNER_OS" != "macOS" ]; then
            extras="$extras --extra openturns"
          fi
          uv sync --no-install-project --group test --group notebooks $extras
      - name: Download built wheel (<=3.11)
        if: ${{ matrix.python <= 311 }}
        uses: actions/download-artifact@v8
        with:
          name: cibw-wheels-${{ matrix.cfg.os }}-${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
          path: dist/
      - name: Download built wheel (>=3.12, reuses 3.12 ABI3 artifact)
        if: ${{ matrix.python >= 312 }}
        uses: actions/download-artifact@v8
        with:
          name: cibw-wheels-${{ matrix.cfg.os }}-312-${{ matrix.cfg.cibw_id }}
          path: dist/
      - name: Install wheel into uv venv
        shell: bash
        run: |
          uv pip install dist/*.whl
      - name: Run tests
        # UV_NO_SYNC: test the pre-installed wheel, not an editable rebuild.
        # Serial — see pyproject.toml's pytest config.
        uses: nick-fields/retry@v4
        env:
          UV_NO_SYNC: "1"
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: |
            uv run pytest tests/ -r a --no-cov --reruns 2 --reruns-delay 10
      - name: Run notebooks as unit tests
        uses: nick-fields/retry@v4
        env:
          UV_NO_SYNC: "1"
          # `pyproject.toml`'s `filterwarnings` governs the pytest
          # process; nbmake runs each notebook in its own kernel, which
          # starts from the default filters and so ignores
          # DeprecationWarning. Without this a notebook could keep
          # calling a deprecated name indefinitely. The `__main__` scope
          # is required: a bare `error::DeprecationWarning` also promotes
          # nbclient's "no current event loop" warning and fails here.
          PYTHONWARNINGS: "error::DeprecationWarning:__main__"
        with:
          timeout_minutes: 30
          max_attempts: 5
          retry_wait_seconds: 60
          shell: bash
          command: |
            uv run pytest --nbmake examples/ \
              --no-cov \
              --nbmake-timeout=600 \
              --nbmake-kernel=python3 \
              --reruns 2 --reruns-delay 10

  regenerate_notebooks:
    # Label-only. The job pushes a commit onto the pull request's head branch,
    # which rewrites the base of every pull request stacked on it, so it must
    # never fire on a branch the author did not opt in. Push a commit after
    # labeling — the trigger doesn't include `labeled`.
    name: Regenerate notebook outputs
    needs: build
    if: |
      github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'regenerate-notebooks')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # required to push the auto-commit back to the PR branch
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install Graphviz
        # The notebooks draw vine structures through `dot`.
        uses: ./.github/actions/install-graphviz
      - name: Download built wheel (cp311 ABI3, ubuntu)
        uses: actions/download-artifact@v8
        with:
          name: cibw-wheels-ubuntu-latest-311-manylinux_x86_64
          path: dist/
      - name: Install wheel + examples extras + notebooks group
        run: |
          uv venv --python 3.11
          uv sync --no-install-project --group notebooks --extra examples --extra sklearn --extra torch
          WHEEL=$(ls dist/*.whl)
          uv pip install "${WHEEL}"
      - name: Re-execute notebooks
        env:
          UV_NO_SYNC: "1"
        run: make notebooks
      - name: Commit and push refreshed notebooks
        run: |
          if git diff --quiet -- examples/; then
            echo "Notebooks are already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/
          git commit -m "chore: refresh notebook outputs [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  build_sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint]
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Get history and tags for SCM versioning to work
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Install C++ dependencies
        id: install-dependencies
        # Pinned to a SHA, not a branch: upstream deleted `dev` out from under
        # this reference, and a moving ref lets upstream CI churn break wheels.
        uses: vinecopulib/vinecopulib/.github/actions/install-dependencies@f43820efd16474ec930b5022df54e15cfe02466d
        with:
          os: "ubuntu-latest"
          boost_install_dir: "/home/runner/work"
          eigen_install_dir: "/home/runner/work"
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          # wdm and kde1d ship as lib/ submodules; lcov is only for C++ coverage.
          wdm: "false"
          lcov: "false"
          # The action's default apt-installs g++/clang on the host. cibuildwheel
          # compiles inside the manylinux/musllinux container with its own
          # toolchain, and the other ubuntu jobs only install prebuilt wheels, so
          # the host compilers are never used -- and that apt call has hung the
          # job repeatedly.
          update_compilers_ubuntu: "false"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Export Boost / Eigen include paths
        run: |
          echo "Boost_INCLUDE_DIR=${{steps.install-dependencies.outputs.BOOST_ROOT}}/include" >> $GITHUB_ENV
          echo "EIGEN3_INCLUDE_DIR=/home/runner/work/include/eigen3" >> $GITHUB_ENV
      - name: Sync dev/test deps + editable install
        # Editable install seeds the .pyi stubs that ship with the sdist.
        run: |
          uv sync --no-install-project --all-extras --group dev --group test
          uv pip install -e . --no-build-isolation
      - name: Lint and type-check
        run: make check
      - name: Run torch.compile tests
        # `addopts` deselects these by default, each paying a cold Inductor
        # compilation, so no other leg reaches `compile_cascades`. This leg
        # already carries the checks that run once rather than per-wheel.
        run: uv run pytest tests/ -m compile -r a --no-cov
      - name: Build source distribution
        run: make sdist
      - name: Install source distribution into fresh venv
        # Separate venv: the editable meta-path finder would trigger a
        # CMake rebuild during the sdist install. Order matters — `uv sync`
        # prunes anything outside its lock, so the sdist install runs after.
        run: |
          uv venv .venv-sdist --python 3.11
          VIRTUAL_ENV="$PWD/.venv-sdist" uv sync --no-install-project --group test --active
          VIRTUAL_ENV="$PWD/.venv-sdist" uv pip install dist/*.tar.gz
      - name: Run tests against installed sdist
        env:
          UV_NO_SYNC: "1"
        run: |
          VIRTUAL_ENV="$PWD/.venv-sdist" uv run --active \
            pytest tests/ -r a --no-cov --reruns 2 --reruns-delay 10
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_to_pypi:
    needs: [build_sdist, check_wheels, install_and_unit_test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      # Before the artifacts land: checkout cleans the workspace.
      - uses: actions/checkout@v7
      # PyPI never re-accepts a version number, so a tag that disagrees with
      # the metadata is unrecoverable. The `lint` job runs the same check on
      # every pull request, but without a tag to compare against and while the
      # changelog heading is still legitimately `(unreleased)`.
      - name: Check the version metadata matches the tag
        if: ${{ startsWith(github.event.ref, 'refs/tags') }}
        run: python3 scripts/check_version.py --released --tag "$GITHUB_REF_NAME"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Download cibw artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Verify downloaded wheel integrity and metadata
        run: |
          N_WHEELS=$(find dist -type f -name '*.whl' | wc -l)
          N_EXPECTED=${EXPECTED_WHEEL_COUNT:-0}
          echo "Found $N_WHEELS wheel(s); expected $N_EXPECTED"

          if [ "$N_WHEELS" -ne "$N_EXPECTED" ]; then
            echo "::error ::Expected $N_EXPECTED wheels, found $N_WHEELS."
            ls -1 dist/
            exit 1
          fi

          find dist -type f -name '*.whl' -printf "%P\n" | sort
          uvx --quiet twine check dist/* || {
            echo "::error ::Metadata check failed — would fail on PyPI upload."
            exit 1
          }
      # Rehearsal for the real upload: the same artifacts, action and
      # credentialing path, against a registry where a mistake is survivable.
      # Manual because it is one-shot -- Test PyPI refuses a re-upload of a
      # version it already has, just as PyPI does -- so it is spent
      # deliberately, on the commit about to be tagged.
      - name: Publish distribution to Test PyPI
        if: |
          job.status == 'success'
            && github.event_name == 'workflow_dispatch'
            && inputs.test_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.test_pypi_password }}
          repository-url: https://test.pypi.org/legacy/
      - name: Publish distribution to PyPI
        if: |
          job.status == 'success'
            && github.event_name == 'push'
            && startsWith(github.event.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
