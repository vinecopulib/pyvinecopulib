name: Build Status

on:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  BOOST_VERSION: 1.84.0
  EIGEN_VERSION: 3.4.0
  EXPECTED_WHEEL_COUNT: 16  # 4 platforms × 4 unique wheels (ABI3 covers 3.12+)

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        python: [39, 310, 311, 312]
        cfg:
          - {
              os: ubuntu-latest,
              cibw_id: manylinux_x86_64,
              cc: gcc,
              cxx: g++,
              platform: x64,
              root_install_dir: "/home/runner/work",
            }
          - {
              os: ubuntu-latest,
              cibw_id: musllinux_x86_64,
              cc: gcc,
              cxx: g++,
              platform: x64,
              root_install_dir: "/home/runner/work",
            }
          # - { os: macos-13, cibw_id: macosx_x86_64, cc: clang, cxx: clang++, platform: x64, root_install_dir: '/Users/runner/work'} # intel runner
          - {
              os: macos-14,
              cibw_id: macosx_arm64,
              cc: clang,
              cxx: clang++,
              platform: arm64,
              root_install_dir: "/Users/runner/work",
            }
          - {
              os: windows-latest,
              cibw_id: win_amd64,
              cc: cl,
              cxx: cl,
              platform: x64,
              root_install_dir: 'D:\',
            }

    name: Build and test on ${{ matrix.cfg.os }} for cp${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
    runs-on: ${{ matrix.cfg.os }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get history and tags for SCM versioning to work
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Set up Python 3.11
        # cibuildwheel manages its own Pythons per-wheel, but a host Python
        # is needed for the wheel-inspection step below (uvx twine check).
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install C++ dependencies
        id: install-dependencies
        uses: vinecopulib/vinecopulib/.github/actions/install-dependencies@dev
        with:
          os: ${{ matrix.cfg.os }}
          platform: ${{ matrix.cfg.platform }}
          boost_install_dir: ${{ matrix.cfg.root_install_dir }}
          eigen_install_dir: ${{ matrix.cfg.root_install_dir }}
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          wdm: "false"
      - name: Clean build artefacts
        shell: bash
        run: |
          rm -rf build wheelhouse
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_REBUILD: 1
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
          CIBW_ENVIRONMENT_WINDOWS: Boost_INCLUDE_DIR='${{steps.install-dependencies.outputs.BOOST_ROOT}}\include' EIGEN3_INCLUDE_DIR='C:\ProgramData\chocolatey\lib\eigen\include'
          CIBW_ENVIRONMENT_MACOS: "Boost_INCLUDE_DIR=${{steps.install-dependencies.outputs.BOOST_ROOT}}/include EIGEN3_INCLUDE_DIR=${{matrix.cfg.root_install_dir}}/include/eigen3"
          CIBW_ENVIRONMENT_LINUX: "Boost_INCLUDE_DIR=/host${{steps.install-dependencies.outputs.BOOST_ROOT}}/include EIGEN3_INCLUDE_DIR=/host${{matrix.cfg.root_install_dir}}/include/eigen3"
          CIBW_ENVIRONMENT_PASS_LINUX: "Boost_INCLUDE_DIR EIGEN3_INCLUDE_DIR"
      - name: Inspect built wheel contents
        shell: bash
        run: |
          echo "Inspecting built wheel(s):"
          wheel=$(ls wheelhouse/*.whl)

          # 1. Verify the wheel is a valid ZIP archive
          unzip -t "$wheel" >/dev/null || {
            echo "::error file=$wheel::Corrupted or invalid wheel archive"
            exit 1
          }

          # 2. Check for stub or typing marker files
          unzip -l "$wheel" | grep -E '(__init__\.pyi|py\.typed)' || {
            echo "::error ::Expected stub or marker files not found in $wheel"
            exit 1
          }

          # 3. Verify wheel metadata and long description
          uvx --quiet twine check --strict wheelhouse/*.whl || {
            echo "::error ::Metadata check failed — would fail on PyPI upload."
            exit 1
          }
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.cfg.os }}-${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
          path: ./wheelhouse/*.whl

  check_wheels:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      actions: read
      contents: read

    name: Verify all built wheels

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Download cibw artifacts
        uses: actions/download-artifact@v5
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true
        continue-on-error: true
      - name: Verify downloaded wheel integrity and metadata
        run: |
          echo "Verifying downloaded artifacts in dist/"

          N_WHEELS=$(find dist -type f -name '*.whl' | wc -l)
          N_EXPECTED=${EXPECTED_WHEEL_COUNT:-0}
          echo "Found $N_WHEELS wheel(s); expected $N_EXPECTED"

          if [ "$N_WHEELS" -ne "$N_EXPECTED" ]; then
            echo "::error ::Expected $N_EXPECTED wheels, found $N_WHEELS. Some matrix jobs failed or artifacts missing."
            ls -1 dist/
            exit 1
          fi

          echo "Listing wheel structure:"
          find dist -type f -name '*.whl' -printf "%P\n" | sort

          echo "Checking metadata consistency with twine..."
          uvx --quiet twine check --strict dist/* || {
            echo "::error ::Metadata check failed — would fail on PyPI upload."
            exit 1
          }

  verify_docs_build:
    # Mirrors the Read the Docs build (.readthedocs.yaml) against the wheel
    # built from this PR — so an issue that would surface on RTD only after
    # a tag-and-publish cycle is caught here instead. Stricter than RTD
    # (uses -W to fail on warnings) so doc regressions get blocked at PR
    # time rather than rendering subtly broken on the published site.
    name: Verify docs build (RTD mirror)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        # Match .readthedocs.yaml's build.tools.python.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Graphviz + Pandoc
        # graphviz: matches .readthedocs.yaml's apt_packages.
        # pandoc: needed by nbsphinx to convert notebook markdown
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz pandoc
      - name: Download built wheel (cp311 manylinux ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-ubuntu-latest-311-manylinux_x86_64
          path: dist/
      - name: Install wheel + doc/examples extras
        # Equivalent to RTD's `pip install "pyvinecopulib[doc,examples]"`,
        # except sourced from this PR's wheel rather than PyPI's published
        # version — so the docs reflect the PR's actual API surface.
        run: |
          uv venv --python 3.11
          WHEEL=$(ls dist/*.whl)
          uv pip install "${WHEEL}[doc,examples]"
      - name: Build HTML docs
        # -W: warnings as errors. Catches doc regressions (broken cross-refs,
        # malformed docstrings, etc.) before they reach RTD.
        run: uv run sphinx-build -W -b html docs docs/_build/html
      - name: Upload built HTML for PR review
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/
          retention-days: 14

  install_and_unit_test:
    needs: build
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      fail-fast: false
      matrix:
        python: [39, 310, 311, 312, 313, 314]
        cfg:
          - { os: ubuntu-latest, cibw_id: manylinux_x86_64 }
          - { os: macos-14, cibw_id: macosx_arm64 }
          - { os: windows-latest, cibw_id: win_amd64 }
    name: Install wheel and run unit tests on ${{ matrix.cfg.os }} for cp${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Infer full Python version
        id: pyver
        shell: bash
        run: |
          short="${{ matrix.python }}"
          major="${short:0:1}"
          minor="${short:1}"
          echo "version=$major.$minor" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install Graphviz
        shell: bash
        run: |
          if [[ "${{ matrix.cfg.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y graphviz
          elif [[ "${{ matrix.cfg.os }}" == "macos-14" ]]; then
            brew install graphviz
          elif [[ "${{ matrix.cfg.os }}" == "windows-latest" ]]; then
            choco install graphviz -y
          fi
      - name: Create uv venv and install test/notebooks deps
        shell: bash
        run: |
          uv venv --python ${{ steps.pyver.outputs.version }}
          # Install only the dep groups + extras needed for the test
          # run; the wheel itself is installed in the next step. The
          # --no-install-project flag is essential: we don't want uv to
          # build the project from source — we want to test the
          # cibuildwheel-produced wheel.
          uv sync --no-install-project --group test --group notebooks --extra examples
      # For Python <= 3.11: download its exact artifact
      - name: Download built wheel (<=3.11)
        if: ${{ matrix.python <= 311 }}
        uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.cfg.os }}-${{ matrix.python }}-${{ matrix.cfg.cibw_id }}
          path: dist/
      # For Python >= 3.12: reuse the 3.12 ABI3 artifact
      - name: Download built wheel (>=3.12)
        if: ${{ matrix.python >= 312 }}
        uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.cfg.os }}-312-${{ matrix.cfg.cibw_id }}
          path: dist/
      - name: Install wheel into uv venv
        shell: bash
        run: |
          uv pip install dist/*.whl
      - name: Run tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: |
            # Serial run — see the note in pyproject.toml's
            # [tool.pytest.ini_options] for why CI avoids pytest-xdist
            # on GitHub Actions runners.
            uv run pytest tests/ -r a --no-cov --reruns 2 --reruns-delay 10
      - name: Run notebooks as unit tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 5
          retry_wait_seconds: 60
          shell: bash
          command: |
            uv run pytest --nbmake examples/ \
              --no-cov \
              --nbmake-timeout=600 \
              --nbmake-kernel=python3 \
              --reruns 2 --reruns-delay 10

  regenerate_notebooks:
    # Fires automatically on every PR to main (the release-prep flow), and
    # opt-in on any other PR via the `regenerate-notebooks` label — handy
    # for testing this workflow against `dev`, or refreshing outputs early
    # when a feature branch changes plotting code.
    #
    # To use the opt-in path: open the PR and add the label
    # `regenerate-notebooks` (`gh pr edit <PR> --add-label regenerate-notebooks`),
    # then push a commit so the workflow re-evaluates (the trigger types
    # below don't include `labeled`, so labeling alone won't re-fire).
    #
    # RTD relies on the committed cell outputs (nbsphinx_execute = "never"
    # in docs/conf.py), so this job is what keeps them fresh without
    # manual intervention before release.
    name: Regenerate notebook outputs
    needs: build
    if: |
      github.event_name == 'pull_request'
      && (
        github.base_ref == 'main'
        || contains(github.event.pull_request.labels.*.name, 'regenerate-notebooks')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push the auto-commit back to the PR branch
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Need full history so the push is a fast-forward.
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Download built wheel (cp311 ABI3, ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-ubuntu-latest-311-manylinux_x86_64
          path: dist/
      - name: Install wheel + examples extras + notebooks group
        run: |
          uv venv --python 3.11
          # Install the notebooks dependency group (jupyter, nbconvert,
          # nbformat, nbmake) and the examples extra (jupyterlab, scipy);
          # then drop the cibuildwheel wheel on top.
          uv sync --no-install-project --group notebooks --extra examples
          WHEEL=$(ls dist/*.whl)
          uv pip install "${WHEEL}"
      - name: Re-execute notebooks
        run: uv run python scripts/regenerate_notebooks.py
      - name: Commit and push refreshed notebooks
        run: |
          if git diff --quiet -- examples/; then
            echo "Notebooks are already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/
          git commit -m "chore: refresh notebook outputs [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  build_sdist:
    runs-on: ubuntu-latest
    # needs: build
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get history and tags for SCM versioning to work
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Install C++ dependencies
        id: install-dependencies
        uses: vinecopulib/vinecopulib/.github/actions/install-dependencies@dev
        with:
          os: "ubuntu-latest"
          boost_install_dir: "/home/runner/work"
          eigen_install_dir: "/home/runner/work"
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Export Boost / Eigen include paths
        run: |
          echo "Boost_INCLUDE_DIR=${{steps.install-dependencies.outputs.BOOST_ROOT}}/include" >> $GITHUB_ENV
          echo "EIGEN3_INCLUDE_DIR=/home/runner/work/include/eigen3" >> $GITHUB_ENV
      - name: Sync dev/test deps + editable install
        # The editable install is necessary so the CMake build emits the
        # per-subpackage .pyi stubs that the sdist ships with.
        run: |
          uv sync --all-extras --group dev --group test
          uv pip install -e . --no-build-isolation
      - name: Lint and type-check
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run ty check
      - name: Build source distribution
        run: uv build --sdist
      - name: Install source distribution into fresh venv
        # Use a separate venv so the editable install's meta-path finder
        # (`_pyvinecopulib_editable.py`) doesn't trigger a CMake rebuild
        # when the sdist's POST_BUILD stub-gen step imports the package.
        run: |
          uv venv .venv-sdist --python 3.11
          VIRTUAL_ENV="$PWD/.venv-sdist" uv pip install dist/*.tar.gz
          VIRTUAL_ENV="$PWD/.venv-sdist" uv sync --no-install-project --group test --active
      - name: Run tests against installed sdist
        # Serial run (xdist not in addopts) — see pyproject.toml.
        run: |
          VIRTUAL_ENV="$PWD/.venv-sdist" uv run --active \
            pytest tests/ -r a --no-cov --reruns 2 --reruns-delay 10
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_to_pypi:
    needs: [build_sdist, check_wheels, install_and_unit_test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Download cibw artifacts
        uses: actions/download-artifact@v5
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Verify downloaded wheel integrity and metadata
        run: |
          echo "Verifying downloaded artifacts in dist/"

          N_WHEELS=$(find dist -type f -name '*.whl' | wc -l)
          N_EXPECTED=${EXPECTED_WHEEL_COUNT:-0}
          echo "Found $N_WHEELS wheel(s); expected $N_EXPECTED"

          if [ "$N_WHEELS" -ne "$N_EXPECTED" ]; then
            echo "::error ::Expected $N_EXPECTED wheels, found $N_WHEELS. Some matrix jobs failed or artifacts missing."
            ls -1 dist/
            exit 1
          fi

          echo "Listing wheel structure:"
          find dist -type f -name '*.whl' -printf "%P\n" | sort

          echo "Checking metadata consistency with twine..."
          uvx --quiet twine check dist/* || {
            echo "::error ::Metadata check failed — would fail on PyPI upload."
            exit 1
          }
      - name: Publish distribution Test PyPI
        if: |
          job.status == 'success'
            && github.base_ref == 'main'
            && github.head_ref == 'dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.test_pypi_password }}
          repository-url: https://test.pypi.org/legacy/
      - name: Publish distribution to PyPI
        if: |
          job.status == 'success'
            && github.event_name == 'push'
            && startsWith(github.event.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
