# Pre-commit hooks for pyvinecopulib
# Run pre-commit install after cloning the repo to enable these hooks

ci:
  # ty runs against the locally installed package; pre-commit.ci can't
  # build the C++ extension, so skip there.
  skip:
    - ty

repos:
  # Ruff for linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Security linting with bandit. Reads [tool.bandit] (skips, etc.) from
  # pyproject.toml; scoped to the shipped package + build scripts. Keep
  # `rev` in sync with the bandit pin in [dependency-groups].dev.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^(src/pyvinecopulib|scripts)/.*\.py$

  # Type checking with ty (Astral's type checker). ty is alpha and
  # doesn't yet ship a stable pre-commit repo, so we run it as a local
  # hook against the dev env's installed copy. Invoked via `uv run
  # --no-sync` so a plain `git commit` finds ty in the project venv
  # without needing it activated on PATH (and without triggering a
  # rebuild). Skipped on pre-commit.ci, which can't build the extension.
  - repo: local
    hooks:
      - id: ty
        name: ty type checker
        language: system
        entry: uv run --no-sync ty check
        pass_filenames: false
        types_or: [python, pyi]

  # General code quality hooks. Whitespace-modifying hooks skip the
  # auto-generated files.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &generated_files ^(src/pyvinecopulib/__init__\.pyi|src/include/docstr\.hpp)$
      - id: end-of-file-fixer
        exclude: *generated_files
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *generated_files

  # Check requirements files
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: python-check-blanket-noqa

  # CMake formatting
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml]

  # Numpydoc validation for public-API docstrings (see
  # [tool.numpydoc_validation] in pyproject.toml for the active rule
  # set). The CLI invocation of numpydoc reads `exclude_files` from
  # pyproject.toml; pre-commit shells out one file at a time, so we
  # additionally `exclude:` internal modules at the hook level. Keep
  # the two lists in sync.
  - repo: https://github.com/numpy/numpydoc
    rev: v1.8.0
    hooks:
      - id: numpydoc-validation
        files: ^src/pyvinecopulib/.*\.py$
        exclude: |
          (?x)^src/pyvinecopulib/(
            _python_helpers/.*\.py |
            _deprecations\.py |
            sklearn/_mcs\.py |
            sklearn/_base\.py |
            sklearn/_forest_base\.py |
            torch/_batched\.py |
            torch/_fit_tll\.py |
            torch/_util\.py |
            torch/_interp\.py
          )$

  # C++ formatting with clang-format (only for src/ directory).
  # docstr.hpp is auto-generated by CMake at build time (and gitignored);
  # excluded so a stale on-disk copy doesn't get reformatted in dev.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.6
    hooks:
      - id: clang-format
        files: ^src/.*\.(c|cc|cpp|cxx|h|hpp|hxx)$
        exclude: ^src/include/docstr\.hpp$
        args: [--style=Google]
