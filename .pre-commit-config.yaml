# Pre-commit hooks for pyvinecopulib
# Run pre-commit install after cloning the repo to enable these hooks

ci:
  # regen-docstrings and regen-stubs need a local libclang install / a built
  # editable install of pyvinecopulib; pre-commit.ci has neither. The
  # authoritative drift gates live in .github/workflows/pypi.yml.
  skip:
    - regen-docstrings
    - regen-stubs

repos:
  # Ruff for linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pytest
          - types-requests
          - types-setuptools
        pass_filenames: false
        args: [--config-file=pyproject.toml]

  # General code quality hooks. Whitespace-modifying hooks skip the
  # auto-generated files (docstr.hpp, __init__.pyi) so they don't
  # ping-pong with regen-docstrings/regen-stubs.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &generated_files ^(src/pyvinecopulib/__init__\.pyi|src/include/docstr\.hpp)$
      - id: end-of-file-fixer
        exclude: *generated_files
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *generated_files

  # Check requirements files
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: python-check-blanket-noqa

  # CMake formatting
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml]

  # C++ formatting with clang-format (only for src/ directory).
  # docstr.hpp is auto-generated by scripts/generate_docstring.py and is
  # consumed by the C++ compiler — excluded so it doesn't ping-pong with
  # the regen-docstrings hook.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.6
    hooks:
      - id: clang-format
        files: ^src/.*\.(c|cc|cpp|cxx|h|hpp|hxx)$
        exclude: ^src/include/docstr\.hpp$
        args: [--style=Google]

  # Regenerate generated artifacts when their inputs change. Both hooks fail
  # on diff so the developer notices immediately. Skipped on pre-commit.ci
  # (see ci.skip above); the authoritative gates live in pypi.yml.
  - repo: local
    hooks:
      # Regenerate src/include/docstr.hpp when C++ headers in lib/ change.
      # Requires libclang locally (set LIBCLANG_PATH if not in a conda env
      # named via --env).
      - id: regen-docstrings
        name: Regenerate docstr.hpp from C++ headers
        language: system
        entry: bash -c 'python scripts/generate_metadata.py --no-stubs --no-examples && git diff --exit-code src/include/docstr.hpp'
        pass_filenames: false
        files: '^(lib/(vinecopulib|wdm|kde1d)/include/.*\.(hpp|ipp)|scripts/generate_(metadata|docstring)\.py|src/include/docstr\.hpp)$'

      # Regenerate src/pyvinecopulib/__init__.pyi when bindings or Python
      # surface change. Requires an editable install (`pip install -e .
      # --no-build-isolation`); editable.rebuild=true in pyproject.toml keeps
      # the extension fresh on import.
      - id: regen-stubs
        name: Regenerate __init__.pyi from the installed extension
        language: system
        entry: bash -c 'python scripts/generate_stubs.py "$(python -c "import site; print(site.getsitepackages()[0])")" && git diff --exit-code src/pyvinecopulib/__init__.pyi'
        pass_filenames: false
        files: '^(src/pyvinecopulib/(__init__\.py|pair_copuladata\.py|__init__\.pyi|_python_helpers/.*)|src/pyvinecopulib_ext\.cpp|src/include/.*\.(hpp|cpp)|scripts/generate_stubs\.py)$'
