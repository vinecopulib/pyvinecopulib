# Read the Docs config: https://docs.readthedocs.com/platform/stable/config-file/v2.html
# Installs the published PyPI wheel rather than building from source
# (the C++ build is heavier than RTD's runners). PR previews fall back
# to the latest PyPI release; pypi.yml's verify_docs_build covers PR-side
# validation against the wheel built from the PR.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - graphviz
  jobs:
    post_install:
      # `[sklearn]` is needed for autosummary to introspect pyvinecopulib.sklearn.
      - pip install "pyvinecopulib[doc,examples,sklearn]"

sphinx:
  configuration: docs/conf.py
  # Strict -W lives in pypi.yml's verify_docs_build.
  fail_on_warning: false
